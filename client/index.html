<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to home screen (no service worker: there is no offline mode in v1). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LittleSteps" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="LittleSteps nursery school management" />
    <title>LittleSteps</title>
    <style>
      /* Boot placeholder, painted before any script or stylesheet arrives (slow networks).
         Colours and sizes follow the app shell (index.css tokens); React replaces it. */
      .boot {
        background: #fff8f5;
        min-height: 100dvh;
      }
      .boot-splash {
        display: none;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
      }
      [data-boot='splash'] .boot-splash {
        display: flex;
      }
      [data-boot='splash'] .boot-shell {
        display: none;
      }
      .boot-shell {
        display: flex;
        min-height: 100dvh;
      }
      .boot-side {
        display: none;
        width: 16rem;
        flex-shrink: 0;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.25rem 0.75rem;
        background: #fff;
        border-right: 1px solid #f1e1dc;
      }
      .boot-main {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      .boot-head {
        display: flex;
        height: 4rem;
        align-items: center;
        gap: 0.75rem;
        padding: 0 0.75rem;
        background: #fff;
        border-bottom: 3px solid #f2678e;
      }
      .boot-head svg {
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
      }
      .boot-page {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.25rem 1rem;
        box-sizing: border-box;
      }
      .boot-grid {
        display: grid;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .boot-card {
        height: 7.5rem;
        border: 1px solid #f1e1dc;
        border-radius: 1.125rem;
        background: #fff;
        box-shadow:
          0 1px 2px rgb(30 51 9 / 0.05),
          0 6px 16px rgb(158 22 64 / 0.06);
      }
      .boot-bar {
        display: block;
        border-radius: 0.375rem;
        background: #f3efeb;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-dot {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        background: #f3efeb;
      }
      .boot-nav {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        height: 4rem;
        align-items: center;
        justify-content: space-around;
        background: #fff;
        border-top: 1px solid #f1e1dc;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar {
          animation: none;
        }
      }
      @media (min-width: 640px) {
        .boot-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .boot-page {
          padding: 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .boot-side {
          display: flex;
        }
        .boot-head svg {
          display: none;
        }
        .boot-nav {
          display: none;
        }
        .boot-page {
          padding: 1.5rem 2rem;
        }
        .boot-head {
          padding: 0 2rem;
        }
      }
      @media (min-width: 1280px) {
        .boot-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
    <!-- Signed-in pages get the page-shaped shell; the login page and / get the logo splash. -->
    <script>
      document.documentElement.dataset.boot = /^\/(login|change-password)?\/?$/.test(
        location.pathname,
      )
        ? 'splash'
        : 'shell';
    </script>
  </head>
  <body>
    <!-- Painted from the HTML alone (before the scripts arrive on a slow connection); React
         replaces it with the same shell (components/layout/AppShellSkeleton.jsx). -->
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading LittleSteps">
        <div class="boot-splash">
          <svg
            width="56"
            height="56"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 64 64"
          >
            <g transform="translate(4.8 4.8) scale(0.85)">
              <g transform="rotate(-18 32 34) translate(0 -2.5)">
                <path
                  fill="#e23260"
                  d="M31 22c8.5-2.2 16.5 1.8 16.5 9.3 0 6.2-5.3 8.6-8.2 13.2-2.6 4.1-4.6 10.5-11 10.5-6.2 0-8.8-6.3-8.3-12.6.7-9.1 3.4-18.1 11-20.4z"
                />
                <path
                  fill="#f2678e"
                  d="M28.2 27.5c2.6-2.3 6.4-2.8 8.4-1.6 1 .6.6 1.8-.6 2-3 .5-5.3 2-6.7 4.3-.8 1.3-2.4 1-2.4-.4 0-1.6.4-3.2 1.3-4.3z"
                />
                <circle fill="#e23260" cx="23.6" cy="15.6" r="3.3" />
                <circle fill="#e23260" cx="31" cy="12" r="3.6" />
                <circle fill="#e23260" cx="39" cy="12.2" r="3.9" />
                <circle fill="#e23260" cx="46.4" cy="16.4" r="4.4" />
              </g>
            </g>
          </svg>
        </div>
        <div class="boot-shell">
          <div class="boot-side">
            <span class="boot-bar" style="width: 8rem; height: 6.5rem"></span>
            <span class="boot-bar" style="width: 100%; height: 2.75rem"></span>
            <span class="boot-bar" style="width: 80%; height: 2.75rem"></span>
            <span class="boot-bar" style="width: 85%; height: 2.75rem"></span>
            <span class="boot-bar" style="width: 75%; height: 2.75rem"></span>
          </div>
          <div class="boot-main">
            <div class="boot-head">
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                <g transform="translate(4.8 4.8) scale(0.85)">
                  <g transform="rotate(-18 32 34) translate(0 -2.5)">
                    <path
                      fill="#e23260"
                      d="M31 22c8.5-2.2 16.5 1.8 16.5 9.3 0 6.2-5.3 8.6-8.2 13.2-2.6 4.1-4.6 10.5-11 10.5-6.2 0-8.8-6.3-8.3-12.6.7-9.1 3.4-18.1 11-20.4z"
                    />
                    <path
                      fill="#f2678e"
                      d="M28.2 27.5c2.6-2.3 6.4-2.8 8.4-1.6 1 .6.6 1.8-.6 2-3 .5-5.3 2-6.7 4.3-.8 1.3-2.4 1-2.4-.4 0-1.6.4-3.2 1.3-4.3z"
                    />
                    <circle fill="#e23260" cx="23.6" cy="15.6" r="3.3" />
                    <circle fill="#e23260" cx="31" cy="12" r="3.6" />
                    <circle fill="#e23260" cx="39" cy="12.2" r="3.9" />
                    <circle fill="#e23260" cx="46.4" cy="16.4" r="4.4" />
                  </g>
                </g>
              </svg>

              <span style="display: flex; flex: 1; flex-direction: column; gap: 0.4rem">
                <span class="boot-bar" style="width: 9rem; height: 1rem"></span>
                <span class="boot-bar" style="width: 6rem; height: 0.75rem"></span>
              </span>
              <span class="boot-dot"></span>
              <span class="boot-dot"></span>
            </div>
            <div class="boot-page">
              <span class="boot-bar" style="width: 14rem; height: 2rem"></span>
              <span style="display: block; height: 0.6rem"></span>
              <span class="boot-bar" style="width: 20rem; height: 1rem"></span>
              <div class="boot-grid">
                <div class="boot-card"></div>
                <div class="boot-card"></div>
                <div class="boot-card"></div>
              </div>
            </div>
          </div>
          <div class="boot-nav">
            <span class="boot-dot"></span><span class="boot-dot"></span
            ><span class="boot-dot"></span><span class="boot-dot"></span
            ><span class="boot-dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
