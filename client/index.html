<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to home screen (no service worker: there is no offline mode in v1). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LittleSteps" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="LittleSteps nursery school management" />
    <title>LittleSteps</title>
  </head>
  <body>
    <!-- Painted from the HTML alone (before the scripts arrive on a slow connection); React
         replaces it with the same centred mark while the session is restored. -->
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100dvh;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #fff8f5;
        "
        aria-busy="true"
        aria-label="Loading LittleSteps"
      >
        <svg
          width="56"
          height="56"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 64 64"
        >
          <g transform="translate(4.8 4.8) scale(0.85)">
            <g transform="rotate(-18 32 34) translate(0 -2.5)">

                d="M31 22c8.5-2.2 16.5 1.8 16.5 9.3 0 6.2-5.3 8.6-8.2 13.2-2.6 4.1-4.6 10.5-11 10.5-6.2 0-8.8-6.3-8.3-12.6.7-9.1 3.4-18.1 11-20.4z"

              />
              <circle fill="#e23260" cx="23.6" cy="15.6" r="3.3" />
              <circle fill="#e23260" cx="31" cy="12" r="3.6" />
              <circle fill="#e23260" cx="39" cy="12.2" r="3.9" />
              <circle fill="#e23260" cx="46.4" cy="16.4" r="4.4" />
            </g>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>

</html>
