<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LittleSteps — visual directions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eceae6;
        color: #1f2937;
        font-family: system-ui, sans-serif;
      }
      .page-head {
        padding: 24px 16px 8px;
        max-width: 1280px;
        margin: 0 auto;
      }
      .page-head h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .page-head p {
        margin: 0;
        color: #4b5563;
        font-size: 15px;
      }
      .grid {
        display: grid;
        gap: 20px;
        padding: 16px;
        max-width: 1280px;
        margin: 0 auto;
      }
      @media (min-width: 1100px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ---------- shared structure; every value comes from the direction's variables ---------- */
      .dir {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        border-radius: 20px;
        padding: 20px 16px;
        font-size: 17px;
        line-height: 1.5;
      }
      .dir h2 {
        font-size: 22px;
        margin: 0;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .dir .tag {
        color: var(--muted);
        font-size: 14px;
        margin: 2px 0 14px;
      }
      .dir h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 22px 0 8px;
        font-weight: 700;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .sw {
        border-radius: var(--r-sm);
        height: 44px;
        display: flex;
        align-items: flex-end;
        padding: 4px;
        font-size: 10px;
        font-weight: 700;
      }
      .sw span {
        background: rgba(255, 255, 255, 0.85);
        color: #111;
        border-radius: 4px;
        padding: 0 3px;
      }
      .type .h {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.2;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .type .b {
        margin: 4px 0;
      }
      .type .bn {
        font-family: var(--font-bn);
      }
      .type .s {
        font-size: 14px;
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        border: var(--card-border);
        padding: 16px;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ring {
        --p: 95.5;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        background:
          radial-gradient(closest-side, var(--surface) 76%, transparent 78% 100%),
          conic-gradient(var(--present) calc(var(--p) * 1%), var(--track) 0);
      }
      .ring b {
        font-size: 17px;
      }
      .stat .label {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }
      .stat .value {
        font-size: 24px;
        font-weight: 800;
        margin: 0;
      }
      .stat .hint {
        font-size: 14px;
        margin: 0;
        color: var(--present-ink);
        font-weight: 600;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
        font-weight: 700;
        padding: 4px 10px 4px 8px;
        border-radius: 999px;
      }
      .badge svg {
        width: 16px;
        height: 16px;
      }
      .b-present {
        background: var(--present-bg);
        color: var(--present-ink);
      }
      .b-absent {
        background: var(--absent-bg);
        color: var(--absent-ink);
      }
      .b-late {
        background: var(--late-bg);
        color: var(--late-ink);
      }
      .b-excused {
        background: var(--excused-bg);
        color: var(--excused-ink);
      }
      .b-draft {
        background: var(--neutral-bg);
        color: var(--neutral-ink);
      }
      .b-published {
        background: var(--brand-bg);
        color: var(--brand-ink);
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        font: inherit;
        font-weight: 700;
        font-size: 16px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: var(--r-btn);
        border: 2px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--brand);
        color: var(--on-brand);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--brand-ink);
        border-color: var(--line);
      }
      .btn-ghost {
        background: transparent;
        color: var(--brand-ink);
      }
      .btn-danger {
        background: var(--absent-ink);
        color: #fff;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .spin {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
      }

      /* ---------- mini student dashboard, exactly 375px wide ---------- */
      .phone {
        width: 375px;
        max-width: 100%;
        margin: 0 auto;
        background: var(--bg);
        border-radius: 28px;
        overflow: hidden;
        border: 8px solid #1f2937;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }
      .appbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: var(--appbar);
        color: var(--appbar-ink);
        border-bottom: 4px solid var(--appbar-edge, transparent);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent-bg);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 15px;
        flex: none;
      }
      .appbar .who {
        flex: 1;
        min-width: 0;
        line-height: 1.25;
      }
      .appbar .who b {
        display: block;
        font-size: 16px;
      }
      .appbar .who span {
        font-size: 13px;
        opacity: 0.85;
      }
      .bell {
        position: relative;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
      }
      .bell svg {
        width: 24px;
        height: 24px;
      }
      .bell i {
        position: absolute;
        top: 6px;
        right: 5px;
        background: var(--absent-ink);
        color: #fff;
        font-style: normal;
        font-size: 11px;
        font-weight: 800;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        padding: 0 4px;
      }
      .content {
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      .hello {
        font-size: 20px;
        font-weight: 800;
        margin: 2px 0 0;
      }
      .hello-sub {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .counts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .count {
        border-radius: var(--r-sm);
        padding: 8px;
        text-align: center;
      }
      .count b {
        display: block;
        font-size: 20px;
      }
      .count span {
        font-size: 13px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .row .icon {
        width: 40px;
        height: 40px;
        border-radius: var(--r-sm);
        background: var(--brand-bg);
        color: var(--brand-ink);
        display: grid;
        place-items: center;
        flex: none;
      }
      .row .icon svg {
        width: 20px;
        height: 20px;
      }
      .row p {
        margin: 0;
      }
      .row .t {
        font-weight: 700;
      }
      .row .m {
        font-size: 14px;
        color: var(--muted);
      }
      .bn {
        font-family: var(--font-bn);
      }
      .grade {
        margin-left: auto;
        font-size: 20px;
        font-weight: 800;
        color: var(--brand-ink);
      }
      .navbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
        background: var(--surface);
        padding: 6px 4px 10px;
      }
      .nav {
        display: grid;
        justify-items: center;
        gap: 2px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        min-height: 48px;
        padding-top: 4px;
      }
      .nav svg {
        width: 22px;
        height: 22px;
      }
      .nav.on {
        color: var(--brand-ink);
      }
      .nav.on svg {
        background: var(--brand-bg);
        border-radius: 999px;
        padding: 2px 12px;
        width: 46px;
        box-sizing: content-box;
      }
      .grid > * {
        min-width: 0;
      }
      /* On a phone the mockup is the real screen: edge to edge, exactly the viewport width. */
      @media (max-width: 480px) {
        .grid {
          padding: 0;
          gap: 0;
        }
        .dir {
          border-radius: 0;
          border-bottom: 6px solid #d6d2ca;
        }
        .phone {
          width: auto;
          max-width: none;
          margin: 0 -16px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          border-top: 1px solid var(--line);
        }
      }
      .pill-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        margin-top: 18px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }
      .note b {
        color: var(--ink);
      }

      /* ---------- Direction A: Sunlit Teal (warm, rounded, soft) ---------- */
      .a {
        --font: 'Nunito', system-ui, sans-serif;
        --font-bn: 'Hind Siliguri', 'Nunito', sans-serif;
        --bg: #fbf8f3;
        --surface: #ffffff;
        --ink: #1f2a37;
        --muted: #5b6573;
        --line: #e8e2d8;
        --track: #e9efee;
        --brand: #0f766e;
        --on-brand: #ffffff;
        --brand-ink: #0f5f58;
        --brand-bg: #d9f2ee;
        --focus: #f59e0b;
        --accent-bg: #ffe4d6;
        --accent-ink: #9a3412;
        --appbar: #0f766e;
        --appbar-ink: #ffffff;
        --present: #16a34a;
        --present-bg: #dcfce7;
        --present-ink: #15803d;
        --absent-bg: #fee2e2;
        --absent-ink: #b91c1c;
        --late-bg: #fef3c7;
        --late-ink: #92400e;
        --excused-bg: #e0e7ff;
        --excused-ink: #3730a3;
        --neutral-bg: #eef0f3;
        --neutral-ink: #374151;
        --r: 20px;
        --r-sm: 14px;
        --r-btn: 999px;
        --shadow: 0 1px 2px rgba(31, 42, 55, 0.05), 0 6px 16px rgba(31, 42, 55, 0.06);
        --card-border: 0;
      }
      /* ---------- Direction B: Garden & Marigold (calm, grounded, bordered) ---------- */
      .b {
        --font: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-bn: 'Noto Sans Bengali', 'Plus Jakarta Sans', sans-serif;
        --bg: #f7f5ee;
        --surface: #fffefa;
        --ink: #1c2521;
        --muted: #58625c;
        --line: #e3e0d2;
        --track: #ebe8dc;
        --brand: #2f5d4a;
        --on-brand: #ffffff;
        --brand-ink: #264d3d;
        --brand-bg: #e1ece4;
        --focus: #d97706;
        --accent-bg: #fbe7b8;
        --accent-ink: #7c4a03;
        --appbar: #fffefa;
        --appbar-ink: #1c2521;
        --present: #15803d;
        --present-bg: #dcfce7;
        --present-ink: #166534;
        --absent-bg: #fde2e1;
        --absent-ink: #b42318;
        --late-bg: #fdecc8;
        --late-ink: #8a4b04;
        --excused-bg: #e6e3f5;
        --excused-ink: #463a86;
        --neutral-bg: #eeece4;
        --neutral-ink: #3f4640;
        --r: 12px;
        --r-sm: 10px;
        --r-btn: 10px;
        --shadow: none;
        --card-border: 1px solid #e3e0d2;
      }
      /* ---------- Direction C: Sky Classroom (bright, crisp, readable) ---------- */
      .c {
        --font: 'Lexend', system-ui, sans-serif;
        --font-bn: 'Noto Sans Bengali', 'Lexend', sans-serif;
        --bg: #f4f7fc;
        --surface: #ffffff;
        --ink: #17213a;
        --muted: #56617a;
        --line: #dfe6f2;
        --track: #e6ecf6;
        --brand: #3553c6;
        --on-brand: #ffffff;
        --brand-ink: #2c47ad;
        --brand-bg: #e3e9fb;
        --focus: #f97316;
        --accent-bg: #ffe1d2;
        --accent-ink: #a13d12;
        --appbar: linear-gradient(135deg, #3553c6, #5a74e0);
        --appbar-ink: #ffffff;
        --present: #16a34a;
        --present-bg: #dcfce7;
        --present-ink: #15803d;
        --absent-bg: #fee2e2;
        --absent-ink: #c0262d;
        --late-bg: #fef0c7;
        --late-ink: #93460b;
        --excused-bg: #f0e6fb;
        --excused-ink: #6b2fa0;
        --neutral-bg: #edf0f5;
        --neutral-ink: #3b4458;
        --r: 14px;
        --r-sm: 10px;
        --r-btn: 12px;
        --shadow: 0 1px 2px rgba(23, 33, 58, 0.06), 0 4px 12px rgba(23, 33, 58, 0.05);
        --card-border: 0;
      }
      /* ---------- Direction D: Guava (Charleston, Citron, Cerise, Deep Blush, Light Pink) ----------
         Citron (#849A28, 3.2:1 on white) and Cerise (#E23260, 4.3:1) are too light for small text,
         so they fill graphics and tints; text uses darker shades of the same hues. The statuses
         come from the palette too: olive = present, cerise = absent. */
      .d {
        --font: 'Outfit', system-ui, sans-serif;
        --font-bn: 'Hind Siliguri', 'Outfit', sans-serif;
        --bg: #fff8f5;
        --surface: #ffffff;
        --ink: #1e2616;
        --muted: #5f5a52;
        --line: #f1e1dc;
        --track: #f3ebe4;
        --brand: #1e3309;
        --on-brand: #ffffff;
        --brand-ink: #2f4a12;
        --brand-bg: #edf2d9;
        --focus: #e23260;
        --accent-bg: #fcd4d6;
        --accent-ink: #9e1640;
        --appbar: #1e3309;
        --appbar-ink: #ffffff;
        --appbar-edge: #f2678e;
        --present: #849a28;
        --present-bg: #eef3d6;
        --present-ink: #4a5a0e;
        --absent-bg: #fde3e9;
        --absent-ink: #b0173f;
        --late-bg: #fef1c7;
        --late-ink: #8a4b04;
        --excused-bg: #ece7fa;
        --excused-ink: #4b3a99;
        --neutral-bg: #f2eeea;
        --neutral-ink: #45403a;
        --r: 18px;
        --r-sm: 12px;
        --r-btn: 14px;
        --shadow: 0 1px 2px rgba(30, 51, 9, 0.05), 0 6px 16px rgba(158, 22, 64, 0.06);
        --card-border: 1px solid #f4e6e2;
      }
      .source {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-bottom: 6px;
      }
      .source div {
        border-radius: var(--r-sm);
        height: 58px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <header class="page-head">
      <h1>LittleSteps — four visual directions</h1>
      <p>
        Same content, four looks. Each shows palette, typography (with Bangla), a stat card, status
        badges, buttons and the student dashboard at 375 px.
      </p>
    </header>

          id="i-award"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="6" />
          <path d="M15.5 13 17 22l-5-3-5 3 1.5-9" />
        </symbol>
      </defs>
    </svg>

    <main class="grid">
      <!-- The same markup for every direction; only the direction class changes. -->
      <template id="direction">
        <div class="swatches">
          <div class="sw" style="background: var(--brand)"><span>brand</span></div>
          <div class="sw" style="background: var(--brand-bg)"><span>tint</span></div>
          <div class="sw" style="background: var(--accent-bg)"><span>accent</span></div>
          <div class="sw" style="background: var(--bg); border: 1px solid var(--line)">
            <span>page</span>
          </div>
          <div class="sw" style="background: var(--ink)"><span>ink</span></div>
        </div>

        <h3>Typography</h3>
        <div class="type">
          <p class="h">Good morning, Sharmin</p>
          <p class="b">Ayaan was present all week. Large, calm body text for reading on a phone.</p>
          <p class="b bn">আয়ান রহমান — আজ উপস্থিত। খুব সুন্দর ছবি এঁকেছে!</p>
          <p class="s">Secondary text · Thu, 24 Sep 2026</p>
        </div>

        <h3>Stat card</h3>
        <div class="card stat">
          <div class="ring" role="img" aria-label="Attendance 95.5 percent"><b>95.5%</b></div>
          <div>
            <p class="label">Attendance this session</p>
            <p class="value">21 of 22 days</p>
            <p class="hint">Above the 75% requirement</p>
          </div>
        </div>

        <h3>Status badges (icon + label, never colour alone)</h3>
        <div class="badges">
          <span class="badge b-present"
            ><svg><use href="#i-check" /></svg>Present</span
          >
          <span class="badge b-absent"
            ><svg><use href="#i-x" /></svg>Absent</span
          >
          <span class="badge b-late"
            ><svg><use href="#i-clock" /></svg>Late</span
          >
          <span class="badge b-excused"
            ><svg><use href="#i-shield" /></svg>Excused</span
          >
          <span class="badge b-draft"
            ><svg><use href="#i-pencil" /></svg>Draft</span
          >
          <span class="badge b-published"
            ><svg><use href="#i-send" /></svg>Published</span
          >
        </div>

        <h3>Buttons</h3>
        <div class="buttons">
          <button class="btn btn-primary">Save attendance</button>
          <button class="btn btn-secondary">Cancel</button>
          <button class="btn btn-ghost">Mark all present</button>
          <button class="btn btn-danger">Suspend</button>
          <button class="btn btn-primary" disabled>Disabled</button>
          <button class="btn btn-primary"><span class="spin"></span>Saving…</button>
        </div>

        <h3>Student dashboard · 375 px</h3>
        <div class="phone">
          <div class="appbar">
            <div class="avatar">AR</div>
            <div class="who"><b>Ayaan Rahman</b><span>Playgroup-A · Roll 1</span></div>
            <div class="bell" aria-label="3 unread notifications">
              <svg><use href="#i-bell" /></svg><i>3</i>
            </div>
          </div>
          <div class="content">
            <div>
              <p class="hello">Hello, Sharmin 👋</p>
              <p class="hello-sub">Here is Ayaan's week at a glance.</p>
            </div>
            <div class="card">
              <div class="stat">
                <div class="ring" role="img" aria-label="Attendance 95.5 percent"><b>95.5%</b></div>
                <div>
                  <p class="label">Attendance</p>
                  <p class="value">Great!</p>
                  <p class="hint">Above 75%</p>
                </div>
              </div>
              <div class="counts">
                <div class="count b-present"><b>21</b><span>Present</span></div>
                <div class="count b-absent"><b>1</b><span>Absent</span></div>
                <div class="count b-late"><b>0</b><span>Late</span></div>
              </div>
            </div>
            <div class="card row">
              <div class="icon">
                <svg><use href="#i-award" /></svg>
              </div>
              <div>
                <p class="t">Class Test 1 · English</p>
                <p class="m">18 / 20</p>
                <p class="m bn">“খুব ভালো পড়েছে!”</p>
              </div>
              <span class="grade">A+</span>
            </div>
            <div class="card row">
              <div class="icon">
                <svg><use href="#i-users" /></svg>
              </div>
              <div>
                <p class="t">Parent-teacher meeting</p>
                <p class="m">Thu, 1 Oct · 10:00 · School hall</p>
                <div class="pill-row" style="margin-top: 6px">
                  <span class="badge b-present"
                    ><svg><use href="#i-check" /></svg>Will attend</span
                  >
                </div>
              </div>
            </div>
          </div>
          <nav class="navbar" aria-label="Main">
            <span class="nav on"
              ><svg><use href="#i-home" /></svg>Home</span
            >
            <span class="nav"
              ><svg><use href="#i-cal" /></svg>Attendance</span
            >
            <span class="nav"
              ><svg><use href="#i-book" /></svg>Results</span
            >
            <span class="nav"
              ><svg><use href="#i-user" /></svg>Profile</span
            >
          </nav>
        </div>
      </template>

      <section
        class="dir a"
        data-name="A · Sunlit Teal"
        data-tag="Warm sand background, teal brand, soft coral accent. Nunito (rounded, friendly) + Hind Siliguri. Pill buttons, big radii, soft shadows."
        data-note="<b>Feel:</b> the warmest and most welcoming; closest to today's theme. <b>Watch:</b> rounded type and pills can drift toward playful if overused."
      ></section>
      <section
        class="dir b"
        data-name="B · Garden & Marigold"
        data-tag="Cream paper, deep garden green, marigold accent. Plus Jakarta Sans + Noto Sans Bengali. Bordered flat cards, 10–12 px radii."
        data-note="<b>Feel:</b> calm and grown-up, like a good school prospectus. <b>Watch:</b> the brand green sits near 'present' green, so statuses rely more on their icons."
      ></section>
      <section
        class="dir c"
        data-name="C · Sky Classroom"
        data-tag="Airy blue-grey page, confident blue brand, peach accent. Lexend (built for reading ease) + Noto Sans Bengali. Crisp cards, 12–14 px radii."
        data-note="<b>Feel:</b> bright, modern, most 'app-like'; Lexend is very legible at small sizes. <b>Watch:</b> a little cooler and less homely than A."
      ></section>
      <section
        class="dir d"
        data-name="D · Guava"
        data-tag="Blush-cream page, deep Charleston green brand, Citron for progress, Cerise and pinks as accents. Outfit (clean, friendly geometric) + Hind Siliguri. Soft cards with a blush border."
        data-palette='[["Charleston","#1E3309","#fff"],["Citron","#849A28","#fff"],["Cerise","#E23260","#fff"],["Deep Blush","#F2678E","#1e3309"],["Light Pink","#FCA9AA","#1e3309"]]'
        data-note="<b>Feel:</b> the most distinctive and fresh; the deep green reads calm and serious, and the pinks add warmth without looking childish. <b>Watch:</b> Absent uses the same cerise family as the accent, so it looks gentler than a true red. The icon and label carry the meaning, and Cerise must stay out of success messages."
      ></section>
    </main>

    <script>
      const tpl = document.getElementById('direction');
      for (const section of document.querySelectorAll('.dir')) {
        const head = document.createElement('div');
        head.innerHTML = `<h2>${section.dataset.name}</h2><p class="tag">${section.dataset.tag}</p>`;
        if (section.dataset.palette) {
          const source = document.createElement('div');
          source.className = 'source';
          source.innerHTML = JSON.parse(section.dataset.palette)
            .map(
              ([name, hex, ink]) =>
                `<div style="background:${hex};color:${ink}">${name}<span>${hex}</span></div>`,
            )
            .join('');
          head.append(source);
        }
        section.append(head, tpl.content.cloneNode(true));
        const note = document.createElement('p');
        note.className = 'note';
        note.innerHTML = section.dataset.note;
        section.append(note);
      }
    </script>
  </body>
</html>
